name: win 11 + tailscale + Download.bat script

on:
  workflow_dispatch:

permissions:
  contents: write   # لحفظ البيانات في branch اسمه rdp-data
  actions: write    # لإعادة تشغيل الـ workflow تلقائيا

jobs:
  secure-rdp:
    runs-on: windows-2025
    timeout-minutes: 360

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      # المشروع الخاص لحفظ البيانات (غيّره إذا كان اسمه مختلفا)
      DATA_REPO: marayam12/renexa-data
      DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
      # برامج تُثبَّت تلقائيا كل جلسة (أسماء حزم Chocolatey) مفصولة بفاصلة
      APPS: "googlechrome,7zip,vlc,winrar,temurin21,minecraft-launcher"
      # مجلدات إضافية تُحفظ (داخل C:\Users\RDP). Apps = مجلد لبرامجك المحمولة
      APP_DATA_FOLDERS: 'Apps,AppData\Roaming,AppData\Local\Programs,AppData\Local\Microsoft\Edge\User Data'

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Enable Audio over RDP
        continue-on-error: true
        run: |
          # تشغيل خدمات الصوت (معطلة افتراضيا على السيرفر)
          foreach ($s in "AudioEndpointBuilder","Audiosrv") {
              Set-Service -Name $s -StartupType Automatic
              Start-Service -Name $s
          }
          # السماح بتحويل الصوت عبر RDP (تشغيل + ميكروفون)
          $ts = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
          New-Item -Path $ts -Force | Out-Null
          Set-ItemProperty -Path $ts -Name fDisableAudioCapture -Value 0 -Type DWord
          Get-Service AudioEndpointBuilder, Audiosrv | Format-Table Name, Status

      - name: Create RDP User
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $password = $env:RDP_PASSWORD
          $password = "$password".Trim()
          if (-not $password) { Write-Error "RDP_PASSWORD secret is empty"; exit 1 }
          Write-Host "Password length: $($password.Length) characters"
          if ($password.Length -lt 8 -or $password -notmatch '[A-Z]' -or $password -notmatch '[a-z]' -or $password -notmatch '[0-9!@#$%^&*._-]') {
              Write-Error "Password too weak: use 8+ characters with upper-case, lower-case and a digit or symbol"; exit 1
          }
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          }
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

          if (-not (Get-LocalUser -Name "RDP")) {
              Write-Error "User creation failed"
              exit 1
          }

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        timeout-minutes: 4
        run: |
          Start-Service Tailscale -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5
          if (-not "${{ secrets.TAILSCALE_AUTHKEY }}") { Write-Error "TAILSCALE_AUTHKEY secret is empty"; exit 1 }
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=Renexa --unattended --accept-dns=false --timeout=90s 2>&1 | Write-Host

          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }

          if (-not $tsIP) {
              Write-Host "=== DIAGNOSTICS ==="
              Get-Service Tailscale | Format-List Name, Status
              & "$env:ProgramFiles\Tailscale\tailscale.exe" status 2>&1 | Write-Host
              & "$env:ProgramFiles\Tailscale\tailscale.exe" version 2>&1 | Write-Host
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Install apps (Chocolatey)
        continue-on-error: true
        run: |
          foreach ($a in ($env:APPS -split ',')) {
              if ($a) { choco install $a -y --no-progress }
          }

      - name: Install Mesa (software OpenGL - fake GPU)
        continue-on-error: true
        run: |
          New-Item -ItemType Directory C:\Mesa\dl -Force | Out-Null
          # الإصدار 26 ما فيه opengl32.dll، فنستخدم أحدث إصدار 25.x
          $tag = (gh release list --repo pal1000/mesa-dist-win --limit 100 --json tagName --jq '.[].tagName' | Where-Object { $_ -match '^v?25\.' } | Select-Object -First 1)
          if (-not $tag) { Write-Error "No Mesa 25.x release found"; exit 1 }
          Write-Host "Using Mesa release: $tag"
          gh release download $tag --repo pal1000/mesa-dist-win --pattern "*release-msvc.7z" --dir C:\Mesa\dl --clobber
          $z = Get-ChildItem C:\Mesa\dl -Filter *.7z | Select-Object -First 1
          if (-not $z) { Write-Error "Mesa download failed"; exit 1 }
          Write-Host "Mesa archive: $($z.Name)"
          $sz = (Get-Command 7z -ErrorAction SilentlyContinue).Source
          if (-not $sz) { $sz = "C:\Program Files\7-Zip\7z.exe" }
          Write-Host "Using 7z: $sz"
          & $sz x $z.FullName "-oC:\Mesa\x" -y | Select-Object -Last 6 | Write-Host
          Write-Host "=== Mesa DLL files found ==="
          $all = Get-ChildItem C:\Mesa\x -Recurse -File -Filter *.dll -ErrorAction SilentlyContinue
          $all | ForEach-Object { Write-Host ("{0}  ({1} MB)" -f $_.FullName, [math]::Round($_.Length/1MB,1)) }
          $cand = $all | Where-Object { $_.Name -in 'opengl32.dll','libgallium_wgl.dll' }
          $x64 = $cand | Where-Object { $_.FullName -match '[\\/]x64[\\/]' }
          $pick = if ($x64) { $x64 } else { $cand }
          $dir = ($pick | Select-Object -First 1).DirectoryName
          if (-not $dir) { Write-Error "Mesa DLLs not found - see file list above"; exit 1 }
          Write-Host "Using Mesa folder: $dir"
          New-Item -ItemType Directory C:\Mesa\x64 -Force | Out-Null
          Copy-Item "$dir\*.dll" C:\Mesa\x64 -Force
          Get-ChildItem C:\Mesa\x64 | Format-Table Name, Length | Out-String | Write-Host
          # إجبار Mesa على استخدام المعالج (llvmpipe) بدل كرت الشاشة
          [Environment]::SetEnvironmentVariable('GALLIUM_DRIVER', 'llvmpipe', 'Machine')
          Write-Host "Mesa ready"

      - name: Install SKlauncher
        continue-on-error: true
        run: |
          $f = "$env:TEMP\SKlauncher-setup.exe"
          $ok = $false

          # 1) من GitHub Releases الخاصة بالمستودع (أحدث إصدار، أي ملف exe)
          Remove-Item "$env:TEMP\sk" -Recurse -Force -ErrorAction SilentlyContinue
          gh release download --repo sklauncher/installer --pattern "*.exe" --dir "$env:TEMP\sk" --clobber 2>&1 | Write-Host
          $g = Get-ChildItem "$env:TEMP\sk" -Filter *.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($g) { Copy-Item $g.FullName $f -Force; $ok = $true; Write-Host "Installer from GitHub release: $($g.Name)" }

          # 2) إن لم يوجد: نبحث في صفحة التحميل الرسمية
          if (-not $ok) {
              $base = "https://skmedix.pl/downloads"
              $resp = Invoke-WebRequest $base -UseBasicParsing
              $all = @($resp.Links.href | Where-Object { $_ } | Select-Object -Unique)
              Write-Host "Page links ($($all.Count)):"
              $all | ForEach-Object { Write-Host "  $_" }
              $cands = $all | Where-Object { $_ -match 'setup|\.exe|download|windows|win' }
              foreach ($c in $cands) {
                  $url = [Uri]::new([Uri]$base, $c).AbsoluteUri
                  try {
                      Invoke-WebRequest $url -OutFile $f -UseBasicParsing -ErrorAction Stop
                      $fs = [IO.File]::OpenRead($f); $b = New-Object byte[] 2; $null = $fs.Read($b, 0, 2); $fs.Close()
                      if ($b[0] -eq 0x4D -and $b[1] -eq 0x5A -and (Get-Item $f).Length -gt 1MB) { Write-Host "Installer found: $url"; $ok = $true; break }
                  } catch { Write-Host "Skipped: $url" }
              }
          }

          if (-not $ok) { Write-Error "No installer found - send me the full download link"; exit 1 }
          Start-Process $f -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/ALLUSERS' -Wait
          Write-Host "SKlauncher installer finished"

      - name: Prepare backup script
        run: |
          @'
          if (-not (Test-Path "$env:RUNNER_TEMP\restore_ok")) { Write-Host "Restore not completed - backup skipped to protect old data"; exit 0 }
          $zip = "$env:RUNNER_TEMP\backup.zip"
          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          $src = "C:\Users\RDP"
          $stage = "$env:RUNNER_TEMP\stage"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory $stage | Out-Null

          $folders = @("Desktop","Documents","Downloads","Pictures","Videos","Music") +
                     ($env:APP_DATA_FOLDERS -split ',' | Where-Object { $_ })
          foreach ($f in $folders) {
              if (Test-Path "$src\$f") {
                  robocopy "$src\$f" "$stage\$f" /E /R:0 /W:0 /NFL /NDL /NJH /NJS /NP `
                    /XD Cache "Code Cache" GPUCache Crashpad "Service Worker" "Component_CRX_Cache" CachedData DawnCache GrShaderCache ShaderCache Temp Microsoft "$src\AppData\Roaming\.minecraft\assets" "$src\AppData\Roaming\.minecraft\libraries" "$src\AppData\Roaming\.minecraft\runtime" `
                    /XF opengl32.dll libgallium_wgl.dll libglapi.dll | Out-Null
                  $sz = (Get-ChildItem "$stage\$f" -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum
                  Write-Host ("  {0}: {1} MB" -f $f, [math]::Round($sz / 1MB, 1))
              }
          }
          $global:LASTEXITCODE = 0
          if (-not (Get-ChildItem $stage -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1)) { Write-Host "Nothing to back up - skipped"; exit 0 }

          tar -a -c -f $zip -C $stage .
          $global:LASTEXITCODE = 0
          if (-not (Test-Path $zip)) { Write-Host "No zip created"; exit 0 }

          $mb = [math]::Round((Get-Item $zip).Length / 1MB, 1)
          if ($mb -gt 1900) { Write-Host "Backup is $mb MB (limit ~2000 MB) - skipped"; exit 0 }

          $env:GH_TOKEN = $env:DATA_TOKEN
          gh release view data --repo $env:DATA_REPO *> $null
          if ($LASTEXITCODE -ne 0) {
              # المشروع الفارغ يحتاج commit واحد قبل إنشاء release
              $d = "$env:RUNNER_TEMP\datarepo"
              Remove-Item $d -Recurse -Force -ErrorAction SilentlyContinue
              New-Item -ItemType Directory $d | Out-Null
              Push-Location $d
              "renexa data" | Set-Content README.md
              git init -q
              git config user.name "rdp-bot"
              git config user.email "rdp-bot@users.noreply.github.com"
              git checkout -q -b rdp-data
              git add README.md
              git commit -q -m init
              git remote add origin "https://x-access-token:$($env:DATA_TOKEN)@github.com/$($env:DATA_REPO).git"
              git push -q --force origin rdp-data
              Pop-Location
              gh release create data --repo $env:DATA_REPO --target rdp-data --title data --notes "backup storage"
          }
          gh release upload data $zip --repo $env:DATA_REPO --clobber
          Write-Host "Backup uploaded ($mb MB) to release data"
          '@ | Set-Content -Path "$env:RUNNER_TEMP\backup.ps1" -Encoding UTF8

      - name: Maintain Connection + Watch RDP User
        id: keep
        timeout-minutes: 340
        continue-on-error: true
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: the value of secret RDP_PASSWORD"
          Write-Host "==================`n"

          # مراقب Mesa: ينسخ ملفات OpenGL الوهمية بجانب كل javaw.exe (Minecraft و Java) كل 20 ثانية
          Start-Job -ScriptBlock {
              $src = "C:\Mesa\x64"
              $files = "opengl32.dll", "libgallium_wgl.dll", "libglapi.dll"
              while ($true) {
                  if (Test-Path "$src\opengl32.dll") {
                      $found = @()
                      $roots = @(
                          "C:\Users\RDP\AppData\Roaming\.minecraft\runtime",
                          "C:\Program Files (x86)\Minecraft Launcher\runtime",
                          "C:\Program Files\Minecraft Launcher\runtime",
                          "C:\Users\RDP\AppData\Local\Packages\Microsoft.4297127D64EC6_8wekyb3d8bbwe",
                          "C:\Program Files\Eclipse Adoptium"
                      )
                      foreach ($r in $roots) {
                          if (Test-Path $r) { $found += Get-ChildItem $r -Recurse -File -Include javaw.exe,java.exe -ErrorAction SilentlyContinue }
                      }
                      $found.FullName | Set-Content "C:\Users\Public\mesa-found.txt"
                      # (Adoptium صار ضمن القائمة أعلاه)
                      foreach ($j in $found) {
                          foreach ($f in $files) {
                              $t = Join-Path $j.DirectoryName $f
                              if ((Test-Path "$src\$f") -and -not (Test-Path $t)) { Copy-Item "$src\$f" $t -Force -ErrorAction SilentlyContinue }
                          }
                      }
                  }
                  Start-Sleep -Seconds 20
              }
          } | Out-Null

          $rdpProfile = "C:\Users\RDP"
          $startupPath = "$rdpProfile\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup"
          $downloadUrl = "https://gitlab.com/MR.English2008/pcme_rdp/-/raw/main/Downloads.bat"
          $downloadPath = "$startupPath\Downloads.bat"

          while ($true) {
              if (Test-Path $rdpProfile) {
                  try {
                      # استعادة البيانات المحفوظة من المشروع الخاص
                      $r = "$env:RUNNER_TEMP\restore"
                      New-Item -ItemType Directory $r -Force | Out-Null
                      $env:GH_TOKEN = $env:DATA_TOKEN
                      gh release view data --repo $env:DATA_REPO *> $null
                      if ($LASTEXITCODE -ne 0) {
                          Write-Host "No previous backup found (first run)"
                          "ok" | Set-Content "$env:RUNNER_TEMP\restore_ok"
                      } else {
                          gh release download data --repo $env:DATA_REPO --pattern backup.zip --dir $r --clobber 2>$null
                          if (Test-Path "$r\backup.zip") {
                              tar -xf "$r\backup.zip" -C $rdpProfile
                              Write-Host "Data restored from private repo"
                              "ok" | Set-Content "$env:RUNNER_TEMP\restore_ok"
                          } else {
                              Write-Host "Restore FAILED - backups disabled this session to protect old data"
                          }
                      }

                      # مجلد Apps يُخزَّن فعليا على D: (اختصار junction) حتى لا يمتلئ C:
                      New-Item -ItemType Directory "D:\Apps" -Force | Out-Null
                      $appsLink = "$rdpProfile\Apps"
                      $isLink = (Test-Path $appsLink) -and ((Get-Item $appsLink -Force).Attributes -band [IO.FileAttributes]::ReparsePoint)
                      if ((Test-Path $appsLink) -and -not $isLink) {
                          robocopy $appsLink "D:\Apps" /E /MOVE /R:0 /W:0 /NFL /NDL /NJH /NJS /NP | Out-Null
                          $global:LASTEXITCODE = 0
                          Remove-Item $appsLink -Recurse -Force -ErrorAction SilentlyContinue
                      }
                      if (-not (Test-Path $appsLink)) { cmd /c mklink /J "$appsLink" "D:\Apps" | Out-Null }
                      Get-PSDrive C, D | Format-Table Name, @{n="FreeGB";e={[math]::Round($_.Free/1GB,1)}}, @{n="UsedGB";e={[math]::Round($_.Used/1GB,1)}} | Out-String | Write-Host

                      # تثبيت التطبيقات تلقائيا داخل حساب RDP (إذا لم تكن موجودة)
                      $lines = @(
                        'if (Test-Path "C:\Users\Public\apps_done.flag") { exit }',
                        'Start-Transcript -Path "C:\Users\Public\apps.log" -Force | Out-Null',
                        '$dl = "$env:TEMP\appdl"; New-Item -ItemType Directory $dl -Force | Out-Null',
                        'function Get-App($url, $name) { try { Invoke-WebRequest $url -OutFile "$dl\$name" -UseBasicParsing; return "$dl\$name" } catch { Write-Host "Download failed: $name"; return $null } }',
                        'Remove-Item "$env:LOCALAPPDATA\Discord" -Recurse -Force -ErrorAction SilentlyContinue',
                        '$f = Get-App "https://discord.com/api/download?platform=win" "DiscordSetup.exe"; if ($f) { Start-Process $f -ArgumentList "-s" -Wait }',
                        'if (-not (Test-Path "$env:LOCALAPPDATA\Discord\Update.exe")) { Set-Content -Path "$env:USERPROFILE\Desktop\Discord Web.url" -Value "[InternetShortcut]`nURL=https://discord.com/app" }',
                        'if (-not (Test-Path "$env:APPDATA\Spotify\Spotify.exe")) { $f = Get-App "https://download.scdn.co/SpotifySetup.exe" "SpotifySetup.exe"; if ($f) { Start-Process $f -ArgumentList "/silent" -Wait } }',
                        'Set-Content -Path "$env:USERPROFILE\Desktop\Claude.url" -Value "[InternetShortcut]`nURL=https://claude.ai"',
                        'Set-Content -Path "$env:USERPROFILE\Desktop\WhatsApp Web.url" -Value "[InternetShortcut]`nURL=https://web.whatsapp.com"',
                        'New-Item -ItemType File "C:\Users\Public\apps_done.flag" -Force | Out-Null',
                        'Write-Host "apps done"'
                      )
                      $lines | Set-Content -Path "C:\Users\Public\apps.ps1" -Encoding UTF8
                      # يشتغل تلقائيا عند دخولك بـ RDP (داخل جلستك الحقيقية) بدل تشغيله من الخلفية
                      if (-not (Test-Path $startupPath)) { New-Item -ItemType Directory -Path $startupPath -Force | Out-Null }
                      Set-Content -Path "$startupPath\apps.cmd" -Encoding ASCII `
                        -Value 'powershell -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File C:\Users\Public\apps.ps1'
                      Write-Host "App installer will run when RDP user logs in"

                      if (-not (Test-Path $startupPath)) {
                          New-Item -ItemType Directory -Path $startupPath -Force | Out-Null
                      }

                      Invoke-WebRequest -Uri $downloadUrl -OutFile $downloadPath -UseBasicParsing
                      Write-Host "Downloads.bat copied to $downloadPath"

                      cmd /c $downloadPath
                      Write-Host "Downloads.bat executed successfully"
                      break
                  }
                  catch {
                      Write-Host "Error: $($_.Exception.Message)"
                      break
                  }
              }
              else {
                  Write-Host "[$(Get-Date)] Waiting for RDP profile to be created..."
                  Start-Sleep -Seconds 30
              }
          }

          # Keep runner alive + نسخ احتياطي كل 30 دقيقة
          $n = 0
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active"
              Start-Sleep -Seconds 300
              $n++
              if ($n % 6 -eq 0) { & "$env:RUNNER_TEMP\backup.ps1" }
          }

      - name: Final backup
        if: always() && steps.keep.conclusion != 'skipped'
        run: |
          # نغلق المتصفحات أولا حتى تُنسخ ملفاتها كاملة (الملفات المفتوحة قد تُتخطى)
          Get-Process msedge, chrome, firefox -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5
          if (Test-Path "$env:RUNNER_TEMP\backup.ps1") { & "$env:RUNNER_TEMP\backup.ps1" }

      - name: Restart workflow (new session)
        if: ${{ !cancelled() && steps.keep.conclusion != 'skipped' }}
        run: |
          $wf = (($env:GITHUB_WORKFLOW_REF -split '/\.github/workflows/')[1] -split '@')[0]
          Write-Host "Restarting $wf"
          gh workflow run $wf --ref ${{ github.ref_name }}
